name: Live feed run

# Manual run of mt-ingest against live Norwegian open AIS data (NLOD licence).
#
# source = barentswatch (default): the BarentsWatch Live AIS API over HTTPS.
#   Needs repository secrets BW_CLIENT_ID and BW_CLIENT_SECRET (free account,
#   see docs/data-sources.md).
# source = nmea-tcp: the Norwegian Coastal Administration's raw NMEA feed over
#   TCP (153.44.253.27:5631). No account, but it did not accept connections
#   from US networks, including GitHub's runners, when tested on 2026-09-29.
#
# Records for the requested time while flagging anomalies, fails if nothing
# was received, replays the recording twice to prove the output is
# deterministic, and uploads the recording, log and anomalies.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Live source"
        type: choice
        options: [barentswatch, nmea-tcp]
        default: barentswatch
      duration:
        description: "Seconds to record"
        default: "3600"
        required: true
      feed:
        description: "host:port, for nmea-tcp only"
        default: "153.44.253.27:5631"
        required: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE: ${{ inputs.source }}
      FEED: ${{ inputs.feed }}
      DURATION: ${{ inputs.duration }}
      BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
      BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the source is reachable
        run: |
          if [ "$SOURCE" = barentswatch ]; then
            if [ -z "$BW_CLIENT_ID" ] || [ -z "$BW_CLIENT_SECRET" ]; then
              echo "::error::Repository secrets BW_CLIENT_ID and BW_CLIENT_SECRET are not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://live.ais.barentswatch.no/v1/combined)
            echo "BarentsWatch stream endpoint answered HTTP $code without a token (401 expected)."
            test "$code" = 401
            echo "source: BarentsWatch Live AIS API" > first-bytes.txt
          else
            host=${FEED%:*}; port=${FEED##*:}
            if timeout 15 bash -c "exec 3<>/dev/tcp/$host/$port && head -c 400 <&3" > first-bytes.txt; then
              echo "Connected to $FEED. First bytes:"; cat first-bytes.txt; echo
            else
              echo "::error::Could not connect to $FEED within 15 s from this runner."
              exit 1
            fi
          fi

      - name: Build mt-ingest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF
          cmake --build build --target mt-ingest

      - name: Record the live feed
        run: |
          if [ "$SOURCE" = barentswatch ]; then
            set +o pipefail
            tools/barentswatch_stream.sh 2> stream.log \
              | ./build/mt-ingest --stdin --format barentswatch --duration "$DURATION" --record recordings --stats-every 60 \
                  --anomalies anomalies.jsonl 2>&1 \
              | tee ingest.log
          else
            ./build/mt-ingest --tcp "$FEED" --duration "$DURATION" --record recordings --stats-every 60 \
              --anomalies anomalies.jsonl 2>&1 | tee ingest.log
          fi

      - name: Check the run and replay the recording twice
        run: |
          format=nmea; ext=nmea
          if [ "$SOURCE" = barentswatch ]; then format=barentswatch; ext=jsonl; fi
          lines=$(awk '/^lines/ {print $2}' ingest.log | tail -1)
          msgs=$(awk '/^messages/ {print $2}' ingest.log | tail -1)
          echo "lines $lines, messages $msgs"
          test "${lines:-0}" -gt 0 && test "${msgs:-0}" -gt 0
          cat recordings/*."$ext" > "all.$ext"
          a=$(./build/mt-ingest --replay "all.$ext" --format "$format" --speed 0 --json 2>replay1.log | sha256sum)
          b=$(./build/mt-ingest --replay "all.$ext" --format "$format" --speed 0 --json 2>replay2.log | sha256sum)
          echo "replay 1: $a"; echo "replay 2: $b"
          grep -E '^(lines|messages|queue dropped)' replay1.log
          test "$a" = "$b"
          # Replay must process every recorded line: nothing dropped, same count as recorded.
          test "$(awk '/^queue dropped/ {print $3}' replay1.log)" -eq 0
          test "$(awk '/^lines/ {print $2}' replay1.log | tail -1)" -eq "$(wc -l < "all.$ext")"
          {
            echo "## Live run: $SOURCE for ${DURATION} s"
            echo
            echo '```'
            tail -n 25 ingest.log
            echo '```'
            echo
            echo "Recording: $(wc -l < "all.$ext") lines in $(ls recordings | wc -l) file(s). Two replays gave identical decoded output ($a)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-run
          path: |
            ingest.log
            stream.log
            anomalies.jsonl
            first-bytes.txt
            recordings/
          if-no-files-found: warn
