name: Tracker evaluation

# Downloads real Danish AIS data (about 830 MB, cached after the first run),
# runs the tracker evaluation from docs/tracker-evaluation.md and fails if the
# headline results regress.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/track/**"
      - "include/maritime/track/**"
      - "apps/mt-track/**"
      - "tools/evaluate_tracker.sh"
      - "tools/fetch_dk_slice.sh"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cache the data slice
        id: cache
        uses: actions/cache@v6
        with:
          path: data/oresund-2026-04-22.csv
          key: dk-slice-${{ hashFiles('tools/fetch_dk_slice.sh') }}
      - name: Fetch the data slice
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/fetch_dk_slice.sh data/oresund-2026-04-22.csv
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF
          cmake --build build --target mt-track
      - name: Evaluate
        run: tools/evaluate_tracker.sh build/mt-track data/oresund-2026-04-22.csv | tee evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-evaluation
          path: evaluation.md
