name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.compiler }}, ASan + UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMT_SANITIZE=ON -DMT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Unit tests and real-capture test
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: Build and test (clang, ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        env:
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMT_TSAN=ON -DMT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Tests, threaded ones repeated 20 times
        run: |
          ctest --test-dir build --output-on-failure
          ./build/mt_tests --gtest_repeat=20 --gtest_filter='TcpSource.*:BoundedQueue.*'

  crosscheck:
    name: Cross-check against pyais
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build decoder
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF
          cmake --build build --target mt-decode
      - name: Decode the recorded traffic with both decoders and compare
        run: |
          pip install pyais==3.2.3
          ./build/mt-decode < testdata/pyais-nmea-sample.nmea > mt.jsonl
          python3 tools/crosscheck.py testdata/pyais-nmea-sample.nmea mt.jsonl

  fuzz:
    name: Fuzz (libFuzzer, 8 targets, 60 s each)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Build fuzzers
        env:
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMT_BUILD_TESTS=OFF -DMT_BUILD_FUZZERS=ON
          cmake --build build --target fuzz_decoder fuzz_payload fuzz_framer fuzz_dk_csv fuzz_barentswatch fuzz_anomaly fuzz_collision fuzz_spatial
      - name: Fuzz the stream decoder, seeded with recorded traffic
        run: |
          mkdir -p corpus && head -n 2000 testdata/pyais-nmea-sample.nmea | split -l 20 - corpus/seed-
          ./build/fuzz_decoder -max_total_time=60 -max_len=4096 corpus
      - name: Fuzz the message decoders
        run: |
          mkdir -p corpus-payload
          ./build/fuzz_payload -max_total_time=60 -max_len=256 corpus-payload
      - name: Fuzz the line framer with arbitrary TCP chunking
        run: |
          mkdir -p corpus-framer && head -c 20000 testdata/pyais-nmea-sample.nmea > corpus-framer/seed
          ./build/fuzz_framer -max_total_time=60 -max_len=4096 corpus-framer
      - name: Fuzz the Danish CSV row parser
        run: |
          mkdir -p corpus-dk
          printf '22/04/2026 12:00:00,Class A,219000001,55.700000,12.650000,12.4,80.9,77,Passenger' > corpus-dk/seed
          ./build/fuzz_dk_csv -max_total_time=60 -max_len=512 corpus-dk
      - name: Fuzz the BarentsWatch JSON record parser
        run: |
          mkdir -p corpus-bw
          printf '%s' '{"courseOverGround":289,"latitude":62.79,"longitude":6.90,"speedOverGround":7.5,"mmsi":257000123,"msgtime":"2026-04-22T12:00:00+00:00"}' > corpus-bw/seed
          ./build/fuzz_barentswatch -max_total_time=60 -max_len=1024 corpus-bw
      - name: Fuzz the anomaly detector with arbitrary report sequences
        run: |
          mkdir -p corpus-anomaly
          ./build/fuzz_anomaly -max_total_time=60 -max_len=4096 corpus-anomaly
      - name: Fuzz collision risk with arbitrary positions and velocities
        run: |
          mkdir -p corpus-collision
          ./build/fuzz_collision -max_total_time=60 -max_len=4096 corpus-collision
      - name: Fuzz the pair search against brute force
        run: |
          mkdir -p corpus-spatial
          ./build/fuzz_spatial -max_total_time=60 -max_len=4096 corpus-spatial

  benchmark:
    name: Pair-search benchmark (all methods must agree)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build mt-bench
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF
          cmake --build build --target mt-bench
      # Fails if any method returns different pairs. Timings on shared runners
      # vary too much to assert on; they go to the job summary.
      - name: Benchmark on the live-data test slice, scaled to 100,000 vessels
        run: |
          set -o pipefail
          ./build/mt-bench --barentswatch testdata/barentswatch-live-2026-09-29.jsonl --quick | tee -a "$GITHUB_STEP_SUMMARY"

  barentswatch-bridge:
    name: BarentsWatch bridge against a fake server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build mt-ingest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_TESTS=OFF
          cmake --build build --target mt-ingest
      - name: Stream through token expiry and reconnects, then replay
        env:
          BW_CLIENT_ID: ci-test
          BW_CLIENT_SECRET: ci-secret-not-real
          BW_TOKEN_URL: http://127.0.0.1:8765/connect/token
          BW_STREAM_URL: http://127.0.0.1:8765/v1/combined
        run: |
          # Synthetic input in the Danish CSV layout: 20 vessels steaming east.
          python3 - > synthetic.csv <<'PY'
          import datetime
          t0 = datetime.datetime(2026, 4, 22, 12, 0, 0)
          for k in range(600):
              for v in range(20):
                  t = t0 + datetime.timedelta(seconds=10 * k)
                  lon = 12.0 + v * 0.01 + k * 0.0005
                  print(f"{t:%d/%m/%Y %H:%M:%S},Class A,2190000{v:02d},55.{60 + v},{lon:.6f},10.0,90.0,90,Cargo")
          PY
          python3 tools/fake_barentswatch.py synthetic.csv --port 8765 --per-stream 2500 &
          sleep 1
          tools/barentswatch_stream.sh 2> stream.log \
            | ./build/mt-ingest --stdin --format barentswatch --duration 12 --record rec --stats-every 4 2> ingest.log
          cat stream.log ingest.log
          test "$(grep -c 'token ok' stream.log)" -ge 2          # reconnected with a fresh token
          ! grep -q ci-secret-not-real stream.log ingest.log rec/*  # the secret never leaks
          test "$(awk '/^messages/ {print $2}' ingest.log)" -gt 0
          test "$(awk '/^invalid records/ {print $3}' ingest.log)" -eq 0
          a=$(./build/mt-ingest --replay rec/*.jsonl --format barentswatch --speed 0 --json 2>/dev/null | sha256sum)
          b=$(./build/mt-ingest --replay rec/*.jsonl --format barentswatch --speed 0 --json 2>/dev/null | sha256sum)
          test "$a" = "$b"
      - name: Replay a file far larger than the queue without losing lines
        run: |
          # 200,000 records: three times the 65,536-line queue, so a replay that
          # dropped lines under pressure (a bug found in the first one-hour live
          # run) would lose data and give different output each time.
          python3 - > big.jsonl <<'PY'
          import json
          for k in range(200000):
              print(json.dumps({"mmsi": 219000000 + k % 500, "latitude": 55.6 + (k % 500) * 0.001,
                                "longitude": 12.0 + k * 1e-6, "speedOverGround": 10.0, "courseOverGround": 90.0,
                                "msgtime": f"2026-04-22T12:{(k // 6000) % 60:02d}:{(k // 100) % 60:02d}Z"}))
          PY
          a=$(./build/mt-ingest --replay big.jsonl --format barentswatch --speed 0 --json 2>r1.log | sha256sum)
          b=$(./build/mt-ingest --replay big.jsonl --format barentswatch --speed 0 --json 2>r2.log | sha256sum)
          cat r1.log
          test "$a" = "$b"
          test "$(awk '/^queue dropped/ {print $3}' r1.log)" -eq 0
          test "$(awk '/^lines/ {print $2}' r1.log | tail -1)" -eq 200000

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: Configure
        env:
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DMT_BUILD_TESTS=OFF
      - name: clang-tidy
        run: run-clang-tidy -p build -quiet -warnings-as-errors='*' 'src/|apps/'
